name: Deploy GRID_EDITOR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix XML pretty formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          start = s.index('function pretty(xml){')
          end = s.index('\nfunction esc(', start)
          new = r'''function pretty(xml){
            try{
              const declaration=(String(xml).match(/^\s*(<\?xml[^?]*\?>)/i)||[])[1]||'';
              const doc=parseXml(xml), indent='    ';
              const escText=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
              const escAttr=v=>escText(v).replace(/"/g,'&quot;');
              const openTag=node=>'<'+node.nodeName+[...node.attributes].map(a=>' '+a.name+'="'+escAttr(a.value)+'"').join('')+'>';
              const emptyTag=node=>'<'+node.nodeName+[...node.attributes].map(a=>' '+a.name+'="'+escAttr(a.value)+'"').join('')+'/>';
              const fmt=(node,depth)=>{
                const pad=indent.repeat(depth);
                if(node.nodeType===Node.COMMENT_NODE)return pad+'<!--'+node.nodeValue+'-->';
                if(node.nodeType===Node.PROCESSING_INSTRUCTION_NODE)return pad+'<?'+node.target+(node.data?' '+node.data:'')+'?>';
                if(node.nodeType!==Node.ELEMENT_NODE)return'';
                const children=[...node.childNodes].filter(n=>!(n.nodeType===Node.TEXT_NODE&&!n.nodeValue.trim()));
                const elementChildren=children.filter(n=>n.nodeType===Node.ELEMENT_NODE);
                if(!children.length)return pad+emptyTag(node);
                if(!elementChildren.length){
                  const value=node.textContent.trim();
                  return pad+openTag(node)+escText(value)+'</'+node.nodeName+'>';
                }
                const lines=[pad+openTag(node)];
                for(const child of children){
                  if(child.nodeType===Node.ELEMENT_NODE||child.nodeType===Node.COMMENT_NODE||child.nodeType===Node.PROCESSING_INSTRUCTION_NODE){
                    const rendered=fmt(child,depth+1);if(rendered)lines.push(rendered);
                  }else if((child.nodeType===Node.TEXT_NODE||child.nodeType===Node.CDATA_SECTION_NODE)&&child.nodeValue.trim()){
                    lines.push(indent.repeat(depth+1)+escText(child.nodeValue.trim()));
                  }
                }
                lines.push(pad+'</'+node.nodeName+'>');
                return lines.join('\n');
              };
              const body=fmt(doc.documentElement,0);
              return declaration?declaration+'\n'+body:body;
            }catch{return xml}
          }'''
          p.write_text(s[:start] + new + s[end:])
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
